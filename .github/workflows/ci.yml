# Fast checks on pushes and PRs to main: Go vet + lint + tests, frontend
# typecheck + unit tests + build + GUI smoke (Playwright over stubbed bindings).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: app/go.sum
      # main.go embeds frontend/dist (//go:embed); create a placeholder so the
      # Go-only checks compile without building the frontend.
      - name: Placeholder embed dir
        working-directory: app
        run: mkdir -p frontend/dist && echo "<!doctype html>" > frontend/dist/index.html
      - name: Vet + test
        working-directory: app
        run: |
          go vet ./...
          go test ./... -count=1
      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@v8
        with:
          working-directory: app
          version: latest

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install + typecheck + unit tests + build
        working-directory: app/frontend
        run: |
          npm ci
          npx tsc --noEmit
          npm run test
          npm run build
      - name: Install Playwright chromium
        working-directory: app/frontend
        run: npx playwright install chromium --with-deps
      - name: GUI smoke (Playwright)
        working-directory: app/frontend
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: app/frontend/test-results/
