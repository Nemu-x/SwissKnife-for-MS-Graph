# Builds SwissKnife for MS Graph desktop for Windows, macOS (universal), and Linux,
# then attaches the artifacts to a GitHub Release.
#
# Trigger: push a tag v* (e.g. v0.2.0) for the full release set, or run manually
# (workflow_dispatch builds artifacts without publishing a release).
#
# The Wails project lives in app/. Binary output name is SwissKnifeGraph (wails.json).

name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26.x'
  NODE_VERSION: '22'
  WAILS_VERSION: 'v2.12.0'
  APP_DIR: app

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ env.APP_DIR }}/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
      - name: Build (windows/amd64 + NSIS installer)
        working-directory: ${{ env.APP_DIR }}
        run: wails build -platform windows/amd64 -nsis -ldflags "-X main.version=${{ github.ref_name }}"
      - name: Stage artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "${{ env.APP_DIR }}/build/bin/SwissKnifeGraph.exe" "dist/SwissKnifeGraph-windows-amd64.exe" -Force
          $installer = Get-ChildItem "${{ env.APP_DIR }}/build/bin" -Filter "*installer.exe" | Select-Object -First 1
          if ($installer) { Copy-Item $installer.FullName "dist/SwissKnifeGraph-windows-amd64-installer.exe" -Force }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ env.APP_DIR }}/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
      - name: Build (darwin/universal)
        working-directory: ${{ env.APP_DIR }}
        run: wails build -platform darwin/universal -ldflags "-X main.version=${{ github.ref_name }}"
      - name: Package .app into zip
        working-directory: ${{ env.APP_DIR }}
        run: |
          cd build/bin
          ditto -c -k --keepParent "SwissKnifeGraph.app" "SwissKnifeGraph-macos-universal.zip"
      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp "${{ env.APP_DIR }}/build/bin/SwissKnifeGraph-macos-universal.zip" dist/
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ env.APP_DIR }}/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install Wails + nfpm
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
      - name: Build (linux/amd64)
        working-directory: ${{ env.APP_DIR }}
        run: wails build -platform linux/amd64 -ldflags "-X main.version=${{ github.ref_name }}"
      - name: Package tar.gz + .deb + .rpm
        working-directory: ${{ env.APP_DIR }}
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VER="${VERSION#v}"
          [ -z "$VER" ] && VER="0.0.0"
          mkdir -p ../dist
          tar -C build/bin -czf "../dist/SwissKnifeGraph-linux-amd64.tar.gz" SwissKnifeGraph
          VERSION="$VER" nfpm package -f ../packaging/nfpm.yaml -p deb -t "../dist/SwissKnifeGraph-linux-amd64.deb"
          VERSION="$VER" nfpm package -f ../packaging/nfpm.yaml -p rpm -t "../dist/SwissKnifeGraph-linux-amd64.rpm"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  publish:
    needs: [windows, macos, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      # Sign the checksums with minisign so downloads can't be tampered with.
      # Gated on the MINISIGN_SECRET_KEY secret; skipped (unsigned) if absent.
      - name: Sign checksums (minisign)
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "MINISIGN_SECRET_KEY not set — publishing UNSIGNED checksums."
            exit 0
          fi
          sudo apt-get update && sudo apt-get install -y minisign
          printf '%s\n' "$MINISIGN_SECRET_KEY" > minisign.key
          echo "$MINISIGN_PASSWORD" | minisign -S -s minisign.key -m dist/SHA256SUMS.txt -x dist/SHA256SUMS.txt.minisig
          rm -f minisign.key
          echo "Signed dist/SHA256SUMS.txt.minisig"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
