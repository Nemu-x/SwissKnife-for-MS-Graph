# Builds SwissKnife for MS Graph desktop for Windows (x64 + ARM64, installer and
# portable), macOS (Apple Silicon + Intel DMGs), and Linux (x64 + ARM64 tar.gz,
# deb, rpm, AppImage), then attaches everything to a GitHub Release.
#
# Trigger: push a tag v* (e.g. v0.2.0) for the full release set, or run manually
# (workflow_dispatch builds artifacts without publishing a release).
#
# The Wails project lives in app/. Binary output name is SwissKnifeGraph (wails.json).
#
# Optional, secret-gated extras (all skipped when the secret is absent, see
# packaging/SIGNING.md and packaging/winget/README.md):
#   - Windows Authenticode signing via Azure Trusted Signing (AZURE_TRUSTED_SIGNING_*)
#   - macOS Developer ID signing + notarization (MACOS_* / APPLE_*)
#   - winget manifest PR after publish (WINGET_TOKEN)

name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26.x'
  NODE_VERSION: '22'
  WAILS_VERSION: 'v2.12.0'
  APP_DIR: app

jobs:
  # Keep About accurate for local dev builds: the tag being released must match
  # the baseVersion constant that local builds fall back to.
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match baseVersion in app/app.go
        run: |
          case "$GITHUB_REF" in refs/tags/v*) ;; *) echo "Not a tag build — skipping."; exit 0 ;; esac
          BASE=$(grep -oP 'baseVersion = "\K[^"]+' app/app.go)
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$BASE" != "$TAG" ]; then
            echo "::error::Tag v$TAG does not match baseVersion \"$BASE\" in app/app.go — bump the constant before tagging."
            exit 1
          fi
          # The NSIS installer stamps its version info from wails.json.
          WJ=$(grep -oP '"productVersion": "\K[^"]+' app/wails.json)
          if [ "$WJ" != "$TAG" ]; then
            echo "::error::Tag v$TAG does not match info.productVersion \"$WJ\" in app/wails.json — bump it before tagging."
            exit 1
          fi
          echo "baseVersion + wails.json productVersion match tag $TAG."

  windows:
    needs: version-check
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: windows-latest
    # ARM64 is best-effort: a failure there must not block the whole release.
    continue-on-error: ${{ matrix.arch == 'arm64' }}
    # Authenticode signing is optional: the signing steps below run only when
    # the AZURE_TRUSTED_SIGNING_* secrets exist (CLIENT_SECRET is the switch);
    # otherwise the artifacts are unsigned exactly as before. The secrets are
    # handed only to the steps that sign, never to build/setup steps.
    # See packaging/SIGNING.md.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ env.APP_DIR }}/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
      # windows-latest runners no longer ship NSIS; without makensis Wails only
      # prints a warning and silently skips the installer (bit us in v0.6.0).
      # choco does not shim makensis, so the install dir must go on PATH too.
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y
          $nsis = @("C:\Program Files (x86)\NSIS", "C:\Program Files (x86)\NSIS\Bin", "C:\Program Files\NSIS") |
            Where-Object { Test-Path (Join-Path $_ 'makensis.exe') } | Select-Object -First 1
          if (-not $nsis) { throw "makensis.exe not found after choco install" }
          Add-Content -Path $env:GITHUB_PATH -Value $nsis
          & (Join-Path $nsis 'makensis.exe') /VERSION
      - name: Build (windows/${{ matrix.arch }} + NSIS installer)
        working-directory: ${{ env.APP_DIR }}
        run: wails build -platform windows/${{ matrix.arch }} -nsis -ldflags "-X main.version=${{ github.ref_name }}"
      # --- Optional code signing (Azure Trusted Signing / "Artifact Signing") ---
      # Order matters: the exe must be signed BEFORE it is packed into the NSIS
      # installer, and the installer is signed AFTER makensis. `wails build -nsis`
      # above already produced an installer with the unsigned exe (and dropped the
      # WebView2 bootstrapper that project.nsi needs), so we sign the exe, re-run
      # makensis exactly as Wails does, then sign the resulting installer.
      - name: Check signing secrets present
        id: sign-gate
        shell: bash
        env:
          AZURE_TRUSTED_SIGNING_CLIENT_SECRET: ${{ secrets.AZURE_TRUSTED_SIGNING_CLIENT_SECRET }}
        run: |
          if [ -n "$AZURE_TRUSTED_SIGNING_CLIENT_SECRET" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "AZURE_TRUSTED_SIGNING_* secrets not set — artifacts stay unsigned."
          fi
      - name: Sign SwissKnifeGraph.exe (Azure Trusted Signing)
        if: steps.sign-gate.outputs.enabled == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TRUSTED_SIGNING_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_TRUSTED_SIGNING_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_TRUSTED_SIGNING_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\${{ env.APP_DIR }}\build\bin\SwissKnifeGraph.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: SwissKnife for MS Graph
          description-url: https://github.com/Nemu-x/SwissKnife-for-MS-Graph
      - name: Rebuild NSIS installer with the signed exe
        if: steps.sign-gate.outputs.enabled == 'true'
        shell: pwsh
        working-directory: ${{ env.APP_DIR }}/build/windows/installer
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE "${{ env.APP_DIR }}\build\bin\SwissKnifeGraph.exe"
          $define = "-DARG_WAILS_" + "${{ matrix.arch }}".ToUpper() + "_BINARY=$exe"
          makensis $define project.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed with exit code $LASTEXITCODE" }
      - name: Sign the NSIS installer (Azure Trusted Signing)
        if: steps.sign-gate.outputs.enabled == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TRUSTED_SIGNING_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_TRUSTED_SIGNING_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_TRUSTED_SIGNING_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\${{ env.APP_DIR }}\build\bin\SwissKnifeGraph-${{ matrix.arch }}-installer.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: SwissKnife for MS Graph Installer
          description-url: https://github.com/Nemu-x/SwissKnife-for-MS-Graph
      - name: Verify Authenticode signatures
        if: steps.sign-gate.outputs.enabled == 'true'
        shell: pwsh
        run: |
          foreach ($f in @("${{ env.APP_DIR }}/build/bin/SwissKnifeGraph.exe",
                           "${{ env.APP_DIR }}/build/bin/SwissKnifeGraph-${{ matrix.arch }}-installer.exe")) {
            $sig = Get-AuthenticodeSignature $f
            if ($sig.Status -ne 'Valid') { throw "$f is not validly signed: $($sig.Status) — $($sig.StatusMessage)" }
            Write-Host "$f signed by $($sig.SignerCertificate.Subject)"
          }
      - name: Stage artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "${{ env.APP_DIR }}/build/bin/SwissKnifeGraph.exe" "dist/SwissKnifeGraph-windows-${{ matrix.arch }}-portable.exe" -Force
          $installer = Get-ChildItem "${{ env.APP_DIR }}/build/bin" -Filter "*installer.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer not found in build/bin — check the makensis step" }
          Copy-Item $installer.FullName "dist/SwissKnifeGraph-windows-${{ matrix.arch }}-installer.exe" -Force
          # Sanity: neither artifact may be a stub.
          Get-ChildItem dist | ForEach-Object {
            if ($_.Length -lt 5MB) { throw "$($_.Name) is suspiciously small: $($_.Length) bytes" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: dist/*

  macos:
    needs: version-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: intel
            runner: macos-15-intel
            platform_arch: amd64
    runs-on: ${{ matrix.runner }}
    # Developer ID signing + notarization is optional: every step below is gated
    # on the MACOS_* / APPLE_* secrets (the .p12 switches signing on, the APPLE_*
    # trio adds notarization); otherwise the DMG ships unsigned with the
    # quarantine helper, exactly as before. Secrets are scoped to the steps that
    # use them. See packaging/SIGNING.md.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ env.APP_DIR }}/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
      - name: Build (darwin/${{ matrix.platform_arch || matrix.arch }})
        working-directory: ${{ env.APP_DIR }}
        run: wails build -platform darwin/${{ matrix.platform_arch || matrix.arch }} -ldflags "-X main.version=${{ github.ref_name }}"
      # --- Optional Developer ID signing + notarization (gated on secrets) ---
      - name: Check signing secrets present
        id: sign-gate
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          sign=false
          notarize=false
          if [ -n "$MACOS_CERTIFICATE_P12" ]; then
            sign=true
            # notarize.sh needs all three; a partial trio would fail the job.
            if [ -n "$APPLE_ID" ] && [ -n "$APPLE_TEAM_ID" ] && [ -n "$APPLE_APP_PASSWORD" ]; then
              notarize=true
            else
              echo "APPLE_ID / APPLE_TEAM_ID / APPLE_APP_PASSWORD incomplete — signing only, no notarization."
            fi
          else
            echo "MACOS_CERTIFICATE_P12 not set — DMG ships unsigned."
          fi
          echo "sign=$sign" >> "$GITHUB_OUTPUT"
          echo "notarize=$notarize" >> "$GITHUB_OUTPUT"
      - name: Import Developer ID certificate into a temporary keychain
        if: steps.sign-gate.outputs.sign == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          CERT="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$CERT"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$CERT" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$CERT"
          # Resolve the identity from the certificate when MACOS_SIGN_IDENTITY is not set.
          if [ -z "$MACOS_SIGN_IDENTITY" ]; then
            MACOS_SIGN_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')"
            [ -n "$MACOS_SIGN_IDENTITY" ] || { echo "::error::No 'Developer ID Application' identity found in MACOS_CERTIFICATE_P12"; exit 1; }
          fi
          # The later codesign steps read the identity from GITHUB_ENV (the
          # certificate name is not a secret; the .p12 and passwords stay scoped).
          echo "MACOS_SIGN_IDENTITY=$MACOS_SIGN_IDENTITY" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "Signing as: $MACOS_SIGN_IDENTITY"
      - name: Sign SwissKnifeGraph.app (Developer ID, hardened runtime)
        if: steps.sign-gate.outputs.sign == 'true'
        run: |
          APP="$(find "${{ env.APP_DIR }}/build/bin" -maxdepth 1 -name '*.app' | head -1)"
          [ -n "$APP" ] || { echo "::error::No .app found in ${{ env.APP_DIR }}/build/bin"; exit 1; }
          codesign --deep --force --options runtime --timestamp --keychain "$SIGNING_KEYCHAIN" --sign "$MACOS_SIGN_IDENTITY" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"
      - name: Notarize + staple SwissKnifeGraph.app
        if: steps.sign-gate.outputs.notarize == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          ZIP="$RUNNER_TEMP/SwissKnifeGraph-app.zip"
          ditto -c -k --keepParent "$APP_PATH" "$ZIP"
          bash packaging/macos/notarize.sh "$ZIP" "$APP_PATH"
          spctl --assess --type execute --verbose=2 "$APP_PATH"
      - name: Package DMG (drag-to-Applications + install notes)
        env:
          # A signed + notarized app needs no quarantine helper in the DMG.
          DMG_SIGNED: ${{ steps.sign-gate.outputs.notarize == 'true' && '1' || '' }}
        run: |
          mkdir -p dist
          bash packaging/macos/create-dmg.sh "${{ env.APP_DIR }}/build/bin" "dist/SwissKnifeGraph-macos-${{ matrix.arch }}.dmg"
      - name: Sign (and notarize + staple) the DMG
        if: steps.sign-gate.outputs.sign == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          NOTARIZE: ${{ steps.sign-gate.outputs.notarize }}
        run: |
          DMG="dist/SwissKnifeGraph-macos-${{ matrix.arch }}.dmg"
          codesign --force --timestamp --keychain "$SIGNING_KEYCHAIN" --sign "$MACOS_SIGN_IDENTITY" "$DMG"
          if [ "$NOTARIZE" = 'true' ]; then
            bash packaging/macos/notarize.sh "$DMG"
          else
            echo "APPLE_* secrets incomplete — DMG signed but NOT notarized."
          fi
      - name: Sanity-check DMG
        run: |
          DMG="dist/SwissKnifeGraph-macos-${{ matrix.arch }}.dmg"
          [ -f "$DMG" ] || { echo "::error::DMG missing"; exit 1; }
          SIZE=$(stat -f%z "$DMG")
          [ "$SIZE" -gt 5000000 ] || { echo "::error::DMG suspiciously small: $SIZE bytes"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*.dmg
      - name: Remove temporary signing keychain
        if: always() && env.SIGNING_KEYCHAIN != ''
        run: security delete-keychain "$SIGNING_KEYCHAIN" || true

  linux:
    needs: version-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            aitool: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            aitool: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ env.APP_DIR }}/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install Wails + nfpm
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
      - name: Build (linux/${{ matrix.arch }})
        working-directory: ${{ env.APP_DIR }}
        # Ubuntu 24.04 ships webkit2gtk 4.1 only; the webkit2_41 tag targets it.
        run: wails build -platform linux/${{ matrix.arch }} -tags webkit2_41 -ldflags "-X main.version=${{ github.ref_name }}"
      - name: Package tar.gz + .deb + .rpm
        # Runs from repo root so the paths in packaging/nfpm.yaml resolve.
        env:
          VERSION: ${{ github.ref_name }}
          NFPM_ARCH: ${{ matrix.arch }}
        run: |
          VER="${VERSION#v}"
          [ -z "$VER" ] && VER="0.0.0"
          mkdir -p dist
          BIN=$(ls app/build/bin | head -1)
          tar -C app/build/bin -czf "dist/SwissKnifeGraph-linux-${{ matrix.arch }}.tar.gz" "$BIN"
          VERSION="$VER" nfpm package -f packaging/nfpm.yaml -p deb -t "dist/SwissKnifeGraph-linux-${{ matrix.arch }}.deb"
          VERSION="$VER" nfpm package -f packaging/nfpm.yaml -p rpm -t "dist/SwissKnifeGraph-linux-${{ matrix.arch }}.rpm"
      - name: Build AppImage
        run: |
          APPDIR=AppDir
          # Binary is renamed to match the Exec= entry of the .desktop file.
          mkdir -p "$APPDIR/usr/bin"
          cp app/build/bin/SwissKnifeGraph "$APPDIR/usr/bin/swissknife-graph"
          cp packaging/linux/swissknife-graph.desktop "$APPDIR/"
          cp app/build/appicon.png "$APPDIR/swissknife-graph.png"
          ln -s usr/bin/swissknife-graph "$APPDIR/AppRun"
          curl -fsSL -o appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.aitool }}.AppImage"
          chmod +x appimagetool
          ARCH=${{ matrix.aitool }} ./appimagetool --appimage-extract-and-run "$APPDIR" "dist/SwissKnifeGraph-linux-${{ matrix.arch }}.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*

  publish:
    needs: [windows, macos, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # for docs/releases/<tag>.md curated notes
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # The release must never ship without its core artifacts (ARM64 legs are
      # best-effort and intentionally not on this list).
      - name: Verify core assets present
        run: |
          for f in \
            SwissKnifeGraph-windows-amd64-installer.exe \
            SwissKnifeGraph-windows-amd64-portable.exe \
            SwissKnifeGraph-macos-arm64.dmg \
            SwissKnifeGraph-macos-intel.dmg \
            SwissKnifeGraph-linux-amd64.tar.gz \
            SwissKnifeGraph-linux-amd64.deb \
            SwissKnifeGraph-linux-amd64.rpm \
            SwissKnifeGraph-linux-amd64.AppImage; do
            [ -s "dist/$f" ] || { echo "::error::missing or empty core asset: $f"; exit 1; }
          done
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      # Sign the checksums with minisign so downloads can't be tampered with.
      # Gated on the MINISIGN_SECRET_KEY secret; skipped (unsigned) if absent.
      - name: Sign checksums (minisign)
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "MINISIGN_SECRET_KEY not set — publishing UNSIGNED checksums."
            exit 0
          fi
          sudo apt-get update && sudo apt-get install -y minisign
          printf '%s\n' "$MINISIGN_SECRET_KEY" > minisign.key
          echo "$MINISIGN_PASSWORD" | minisign -S -s minisign.key -m dist/SHA256SUMS.txt -x dist/SHA256SUMS.txt.minisig
          rm -f minisign.key
          echo "Signed dist/SHA256SUMS.txt.minisig"
      # Curated notes: docs/releases/<tag>.md written before tagging becomes the
      # release body; without the file we fall back to auto-generated notes.
      - name: Check for curated release notes
        id: notes
        run: |
          if [ -s "docs/releases/${GITHUB_REF_NAME}.md" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Using curated notes: docs/releases/${GITHUB_REF_NAME}.md"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No curated notes found — auto-generating."
          fi
      - name: Publish GitHub Release (curated notes)
        if: steps.notes.outputs.exists == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: "🗡️ SwissKnife for MS Graph ${{ github.ref_name }}"
          files: dist/*
          body_path: docs/releases/${{ github.ref_name }}.md
          draft: false
      - name: Publish GitHub Release (auto notes)
        if: steps.notes.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: "🗡️ SwissKnife for MS Graph ${{ github.ref_name }}"
          files: dist/*
          generate_release_notes: true
          draft: false

  # Opens the winget-pkgs update PR (from the Nemu-x/winget-pkgs fork) for the
  # freshly published release. Gated on WINGET_TOKEN: secrets are not available
  # in a job-level `if`, so a first step checks the token and the publish step
  # keys off its output. The releaser only updates packages that already exist —
  # the first version is submitted by hand, see packaging/winget/README.md.
  winget:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Check WINGET_TOKEN present
        id: gate
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if [ -n "$WINGET_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "WINGET_TOKEN not set — skipping winget publish."
          fi
      - name: Publish to winget (Nemu-x.SwissKnifeGraph)
        if: steps.gate.outputs.enabled == 'true'
        uses: vedantmgoyal9/winget-releaser@4ffc7888bffd451b357355dc214d43bb9f23917e # v2
        with:
          identifier: Nemu-x.SwissKnifeGraph
          # Only the NSIS installers — the default regex would also pick up the portable exe.
          installers-regex: 'SwissKnifeGraph-windows-(amd64|arm64)-installer\.exe$'
          max-versions-to-keep: 5
          token: ${{ secrets.WINGET_TOKEN }}
