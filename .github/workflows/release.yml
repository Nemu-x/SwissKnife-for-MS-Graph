# Builds SwissKnife for MS Graph desktop for Windows (x64 + ARM64, installer and
# portable), macOS (Apple Silicon + Intel DMGs), and Linux (x64 + ARM64 tar.gz,
# deb, rpm, AppImage), then attaches everything to a GitHub Release.
#
# Trigger: push a tag v* (e.g. v0.2.0) for the full release set, or run manually
# (workflow_dispatch builds artifacts without publishing a release).
#
# The Wails project lives in app/. Binary output name is SwissKnifeGraph (wails.json).

name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26.x'
  NODE_VERSION: '22'
  WAILS_VERSION: 'v2.12.0'
  APP_DIR: app

jobs:
  # Keep About accurate for local dev builds: the tag being released must match
  # the baseVersion constant that local builds fall back to.
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match baseVersion in app/app.go
        run: |
          case "$GITHUB_REF" in refs/tags/v*) ;; *) echo "Not a tag build — skipping."; exit 0 ;; esac
          BASE=$(grep -oP 'baseVersion = "\K[^"]+' app/app.go)
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$BASE" != "$TAG" ]; then
            echo "::error::Tag v$TAG does not match baseVersion \"$BASE\" in app/app.go — bump the constant before tagging."
            exit 1
          fi
          echo "baseVersion $BASE matches tag."

  windows:
    needs: version-check
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: windows-latest
    # ARM64 is best-effort: a failure there must not block the whole release.
    continue-on-error: ${{ matrix.arch == 'arm64' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ env.APP_DIR }}/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
      # windows-latest runners no longer ship NSIS; without makensis Wails only
      # prints a warning and silently skips the installer (bit us in v0.6.0).
      - name: Install NSIS
        run: choco install nsis -y
      - name: Build (windows/${{ matrix.arch }} + NSIS installer)
        working-directory: ${{ env.APP_DIR }}
        run: wails build -platform windows/${{ matrix.arch }} -nsis -ldflags "-X main.version=${{ github.ref_name }}"
      - name: Stage artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "${{ env.APP_DIR }}/build/bin/SwissKnifeGraph.exe" "dist/SwissKnifeGraph-windows-${{ matrix.arch }}-portable.exe" -Force
          $installer = Get-ChildItem "${{ env.APP_DIR }}/build/bin" -Filter "*installer.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer not found in build/bin — check the makensis step" }
          Copy-Item $installer.FullName "dist/SwissKnifeGraph-windows-${{ matrix.arch }}-installer.exe" -Force
          # Sanity: neither artifact may be a stub.
          Get-ChildItem dist | ForEach-Object {
            if ($_.Length -lt 5MB) { throw "$($_.Name) is suspiciously small: $($_.Length) bytes" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: dist/*

  macos:
    needs: version-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: intel
            runner: macos-15-intel
            platform_arch: amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ env.APP_DIR }}/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
      - name: Build (darwin/${{ matrix.platform_arch || matrix.arch }})
        working-directory: ${{ env.APP_DIR }}
        run: wails build -platform darwin/${{ matrix.platform_arch || matrix.arch }} -ldflags "-X main.version=${{ github.ref_name }}"
      - name: Package DMG (drag-to-Applications + install notes)
        run: |
          mkdir -p dist
          bash packaging/macos/create-dmg.sh "${{ env.APP_DIR }}/build/bin" "dist/SwissKnifeGraph-macos-${{ matrix.arch }}.dmg"
      - name: Sanity-check DMG
        run: |
          DMG="dist/SwissKnifeGraph-macos-${{ matrix.arch }}.dmg"
          [ -f "$DMG" ] || { echo "::error::DMG missing"; exit 1; }
          SIZE=$(stat -f%z "$DMG")
          [ "$SIZE" -gt 5000000 ] || { echo "::error::DMG suspiciously small: $SIZE bytes"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*.dmg

  linux:
    needs: version-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            aitool: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            aitool: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ env.APP_DIR }}/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install Wails + nfpm
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
      - name: Build (linux/${{ matrix.arch }})
        working-directory: ${{ env.APP_DIR }}
        # Ubuntu 24.04 ships webkit2gtk 4.1 only; the webkit2_41 tag targets it.
        run: wails build -platform linux/${{ matrix.arch }} -tags webkit2_41 -ldflags "-X main.version=${{ github.ref_name }}"
      - name: Package tar.gz + .deb + .rpm
        # Runs from repo root so the paths in packaging/nfpm.yaml resolve.
        env:
          VERSION: ${{ github.ref_name }}
          NFPM_ARCH: ${{ matrix.arch }}
        run: |
          VER="${VERSION#v}"
          [ -z "$VER" ] && VER="0.0.0"
          mkdir -p dist
          BIN=$(ls app/build/bin | head -1)
          tar -C app/build/bin -czf "dist/SwissKnifeGraph-linux-${{ matrix.arch }}.tar.gz" "$BIN"
          VERSION="$VER" nfpm package -f packaging/nfpm.yaml -p deb -t "dist/SwissKnifeGraph-linux-${{ matrix.arch }}.deb"
          VERSION="$VER" nfpm package -f packaging/nfpm.yaml -p rpm -t "dist/SwissKnifeGraph-linux-${{ matrix.arch }}.rpm"
      - name: Build AppImage
        run: |
          APPDIR=AppDir
          # Binary is renamed to match the Exec= entry of the .desktop file.
          mkdir -p "$APPDIR/usr/bin"
          cp app/build/bin/SwissKnifeGraph "$APPDIR/usr/bin/swissknife-graph"
          cp packaging/linux/swissknife-graph.desktop "$APPDIR/"
          cp app/build/appicon.png "$APPDIR/swissknife-graph.png"
          ln -s usr/bin/swissknife-graph "$APPDIR/AppRun"
          curl -fsSL -o appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.aitool }}.AppImage"
          chmod +x appimagetool
          ARCH=${{ matrix.aitool }} ./appimagetool --appimage-extract-and-run "$APPDIR" "dist/SwissKnifeGraph-linux-${{ matrix.arch }}.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*

  publish:
    needs: [windows, macos, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # The release must never ship without its core artifacts (ARM64 legs are
      # best-effort and intentionally not on this list).
      - name: Verify core assets present
        run: |
          for f in \
            SwissKnifeGraph-windows-amd64-installer.exe \
            SwissKnifeGraph-windows-amd64-portable.exe \
            SwissKnifeGraph-macos-arm64.dmg \
            SwissKnifeGraph-macos-intel.dmg \
            SwissKnifeGraph-linux-amd64.tar.gz \
            SwissKnifeGraph-linux-amd64.deb \
            SwissKnifeGraph-linux-amd64.rpm \
            SwissKnifeGraph-linux-amd64.AppImage; do
            [ -s "dist/$f" ] || { echo "::error::missing or empty core asset: $f"; exit 1; }
          done
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      # Sign the checksums with minisign so downloads can't be tampered with.
      # Gated on the MINISIGN_SECRET_KEY secret; skipped (unsigned) if absent.
      - name: Sign checksums (minisign)
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "MINISIGN_SECRET_KEY not set — publishing UNSIGNED checksums."
            exit 0
          fi
          sudo apt-get update && sudo apt-get install -y minisign
          printf '%s\n' "$MINISIGN_SECRET_KEY" > minisign.key
          echo "$MINISIGN_PASSWORD" | minisign -S -s minisign.key -m dist/SHA256SUMS.txt -x dist/SHA256SUMS.txt.minisig
          rm -f minisign.key
          echo "Signed dist/SHA256SUMS.txt.minisig"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
