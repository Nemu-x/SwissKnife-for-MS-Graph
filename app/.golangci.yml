version: "2"
linters:
  settings:
    errcheck:
      # Deferred closes and best-effort temp-file cleanup are idiomatic Go;
      # there is nothing meaningful to do with these errors.
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (net/http.ResponseWriter).Write
        - os.Remove
        - os.RemoveAll
  exclusions:
    rules:
      # Fake-server handlers in tests write canned responses; checking every
      # w.Write/Decode return there is pure noise.
      - path: _test\.go
        linters: [errcheck]
      # Playbook and mirror steps are best-effort by design: r.do records the
      # error in the per-step report; the return value is only consulted for
      # gating steps (e.g. a channel add that depends on its team add).
      - path: internal/services/(playbooks|mirror)\.go
        linters: [errcheck]
        text: 'r\.do'
